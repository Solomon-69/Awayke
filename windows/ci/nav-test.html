<!doctype html><meta charset="utf-8"><title>nav-test</title>
<body style="margin:0;background:#1d1d1f"><iframe id="f" style="width:420px;height:1500px;border:0;display:block"></iframe><pre id="out"></pre>
<script>
// Loads the real panel with a fake app state, opens Settings, sends real keyboard events, reports what changed.
const dark = location.search.includes('dark');
const BOOT = { on: true, lidMode: true, display: true, choices: [30, 60, 120], defaultTimer: 0, floor: 15, batteryCutoff: true, warn: true,
  addMinutes: 30, maxMinutes: 43200, maxChoices: 6, timer: 0, since: Date.now() - 600000, offAt: null, dark, version: '9.9.9',
  battery: { present: true, onBattery: true, percent: 80 }, login: false, clickToggles: false, accent: 'amber', accentColor: '#E08A2B',
  accents: { amber: '#E08A2B', blue: '#3B82F6', green: '#22A06B' }, mono: false, notice: '', lidError: '' };
const x = new XMLHttpRequest(); x.open('GET', '../web/panel.html', false); x.send();
const html = x.responseText.replace('<script src="kit.js">', '<script>window.__BOOT__=' + JSON.stringify(BOOT) + ';<\/script><script src="kit.js">')
  .replace('<head>', '<head><base href="../web/">' + (location.search.includes('shot') ? '<style>#navPill{transition:none!important}.view.slide{animation:none!important}</style>' : ''));
const f = document.getElementById('f'); const log = [];
f.onload = () => setTimeout(async () => {
  const d = f.contentDocument, w = f.contentWindow;
  const key = k => { d.dispatchEvent(new w.KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true })); };
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const ok = (c, m) => log.push((c ? 'ok   ' : 'FAIL ') + m);
  const pillShown = () => d.getElementById('navPill').classList.contains('show');
  const stopText = () => { const stops = [...d.querySelectorAll('#settings .card > .row, #settings .card > .sub')].filter(n => n.id !== 'about' && !n.querySelector('#about'));
    const y = parseFloat(d.getElementById('navPill').style.transform.split(',')[1]); const host = d.getElementById('settings').getBoundingClientRect().top;
    const s = stops.find(n => Math.abs(n.getBoundingClientRect().top - host + 2 - y) < 2); return s ? (s.querySelector('.title') || {textContent: '?'}).textContent.trim() : '?'; };
  d.getElementById('openSettings').click(); await wait(500);
  ok(!d.getElementById('settings').hidden, 'Settings view is open');
  ok(!pillShown(), 'no highlight before any key');
  key('ArrowDown'); await wait(500);
  { const pl=d.getElementById('navPill'); const st=[...d.querySelectorAll('#settings .card > .row, #settings .card > .sub')].slice(0,3).map(n=>Math.round(n.getBoundingClientRect().top)); log.push('debug pill '+pl.style.transform+' w='+pl.style.width+' h='+pl.style.height+' rectTop='+Math.round(pl.getBoundingClientRect().top)+' stopTops='+st); }
  ok(pillShown(), 'Down shows the highlight'); ok(stopText() === 'Open at login', 'first stop is Open at login, got ' + stopText());
  key(' '); await wait(300);
  ok(d.querySelector('#settings .card .switch').getAttribute('aria-checked') === 'true', 'Space flips the Open at login switch');
  key('ArrowRight'); await wait(300);
  ok(d.querySelector('#settings .card .switch').getAttribute('aria-checked') === 'false', 'Right flips it back');
  key('ArrowDown'); await wait(400);
  ok(stopText() === 'Single click on the tray icon', 'Down moves to the click chips, got ' + stopText());
  const seg = d.getElementById('clickSeg'); const on0 = seg.querySelector('.chip.on').textContent;
  key('ArrowRight'); await wait(300);
  const on1 = seg.querySelector('.chip.on').textContent; ok(on1 !== on0, 'Right steps the chips: ' + on0 + ' -> ' + on1);
  key('ArrowLeft'); await wait(300); ok(seg.querySelector('.chip.on').textContent === on0, 'Left steps back');
  // walk to the timer drum
  let guard = 0; while (!stopText().startsWith('Timer buttons') && guard++ < 12) { key('ArrowDown'); await wait(120); }
  await wait(300);
  ok(stopText().startsWith('Timer buttons'), 'reached the timer drum stop');
  const val = () => d.querySelector('#newTimer .value').textContent;
  const v0 = val(); key('ArrowRight'); await wait(300); const v1 = val(); key('ArrowLeft'); await wait(300);
  ok(v1 !== v0 && val() === v0, 'drum steps by one and back: ' + v0 + ' -> ' + v1 + ' -> ' + val());
  // wrap
  for (let i = 0; i < 40; i++) { key('ArrowDown'); }
  await wait(400);
  key('ArrowUp'); key('ArrowUp'); await wait(300);
  ok(pillShown(), 'highlight survives wrapping');
  // typing in a text field must not trigger it
  const inp = d.createElement('input'); d.body.appendChild(inp); inp.focus();
  const before = d.querySelector('#settings .card .switch').getAttribute('aria-checked');
  inp.dispatchEvent(new w.KeyboardEvent('keydown', { key: ' ', bubbles: true, cancelable: true })); await wait(100);
  ok(d.querySelector('#settings .card .switch').getAttribute('aria-checked') === before, 'keys inside a text field are ignored');
  inp.remove();
  const s = d.getElementById('settings');
  f.contentWindow.scrollTo(0, 0);
  key('Escape'); await wait(400);
  ok(s.hidden && !d.getElementById('main').hidden, 'Esc goes back to the main view');
  document.getElementById('out').textContent = log.join('\n') + '\n' + (log.some(l => l.startsWith('FAIL')) ? 'SOME FAILED' : 'ALL PASS');
  document.title = log.some(l => l.startsWith('FAIL')) ? 'FAIL' : 'PASS';
  // second pass for the screenshot: open settings, highlight the 3rd stop
  d.getElementById('openSettings').click(); await wait(400); key('ArrowDown'); key('ArrowDown'); key('ArrowDown'); await wait(600);
  if (location.search.includes('shot')) { f.style.height='1000px'; document.getElementById('out').hidden = true; }
  document.getElementById('out').style.color = '#9f9';
}, 700);
f.srcdoc = html;
</script>
